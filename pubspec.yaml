name: jk_pixel_ui
description: "A shared pixel-art Flutter UI kit: 9-sliced button/border/background/bar textures, matching widgets, and a theme engine, extracted from Questvale for reuse across apps."
version: 0.0.1
homepage: https://github.com/JKneedler/jk_pixel_ui
publish_to: "none" # Not intended for pub.dev — consumed via path/git dependency.

environment:
  sdk: ">=2.19.1 <3.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - images/ui/
    - images/ui/borders/
    - images/ui/borders/skills/
    - images/ui/borders/charcoal-gold/
    - images/ui/borders/sunrise-peach/
    - images/ui/borders/violet-dusk/
    - images/ui/buttons/
    - images/ui/buttons/charcoal-gold/
    - images/ui/buttons/sunrise-peach/
    - images/ui/buttons/violet-dusk/
    - images/ui/backgrounds/
    - images/ui/backgrounds/charcoal-gold/
    - images/ui/backgrounds/sunrise-peach/
    - images/ui/backgrounds/violet-dusk/
    - images/ui/bars/
